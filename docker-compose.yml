services:
  db:
    image: postgres:16
    container_name: pedidos-aucp-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: pedidos
    ports:
      - "5434:5432"
    volumes:
      - ./docker-data/pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
