<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado de Pedidos — AUCP</title>
  <meta name="description" content="Pantalla de estado de pedidos para clientes de AUCP." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <script src="theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ==============================
       TEMAS — dark & light
    ============================== */
    :root {
      --font: 'Nunito', system-ui, sans-serif;

      /* comunes */
      --pendiente:   #f59e0b;
      --preparacion: #f97316;
      --entregado:   #22c55e;

      --radius-card: 20px;
      --radius-badge: 14px;
      --radius-pill: 999px;

      --transition: 0.25s ease;
    }

    /* ---- MODO OSCURO (default) ---- */
    [data-theme="dark"] {
      --bg:           #060e1c;
      --bg-panel:     #0c1829;
      --surface:      #122035;
      --surface-2:    #1a2d48;
      --border:       rgba(26, 109, 212, 0.2);
      --border-strong:rgba(26, 109, 212, 0.4);

      --text:         #e8f0fe;
      --text-muted:   #93c5fd;
      --text-faint:   #4e7fb8;

      --header-bg:    rgba(6, 14, 28, 0.96);
      --footer-bg:    rgba(6, 14, 28, 0.96);
      --split-border: rgba(26, 109, 212, 0.25);

      --pend-bg:  rgba(255,215,0,0.12); /* Yellow */
      --prep-bg:  rgba(26,127,232,0.12); /* Blue */
      --ent-bg:   rgba(34,197,94,0.12);   /* Green */

      --panel-cola-bg:   #060e1c;
      --panel-listo-bg:  #081710;

      --shadow-card: 0 4px 20px rgba(0,0,0,0.4);
      --shadow-glow-pend: 0 0 24px rgba(255,215,0,0.15);
      --shadow-glow-prep: 0 0 24px rgba(26,127,232,0.15);
      --shadow-glow-ent:  0 0 28px rgba(34,197,94,0.2);

      --primary:       #1a7fe8;
      --primary-light: #93c5fd;
      --accent:        #FFD700;
      --accent-dark:   #D4A800;
    }

    /* ---- MODO CLARO ---- */
    [data-theme="light"] {
      --bg:           #f0f6ff;
      --bg-panel:     #ffffff;
      --surface:      #e2edfd;
      --surface-2:    #cde0fc;
      --border:       rgba(0,61,165,0.15);
      --border-strong:rgba(0,61,165,0.3);

      --text:         #071428;
      --text-muted:   #2d5a9e;
      --text-faint:   #6b8ec4;

      --header-bg:    rgba(240, 246, 255, 0.96);
      --footer-bg:    rgba(240, 246, 255, 0.96);
      --split-border: rgba(0,61,165,0.18);

      --pend-bg:  rgba(212,168,0,0.12);
      --prep-bg:  rgba(0,91,187,0.1);
      --ent-bg:   rgba(21,128,61,0.1);

      --panel-cola-bg:   #f0f6ff;
      --panel-listo-bg:  #f0faf3;

      --shadow-card: 0 4px 16px rgba(0,30,90,0.08);
      --shadow-glow-pend: 0 0 20px rgba(212,168,0,0.15);
      --shadow-glow-prep: 0 0 20px rgba(0,91,187,0.15);
      --shadow-glow-ent:  0 0 24px rgba(21,128,61,0.18);

      --primary:       #003DA5;
      --primary-light: #1a6dd4;
      --accent:        #B8860B;
      --accent-dark:   #9a7009;
    }

    /* ==============================
       BASE
    ============================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      transition: background var(--transition), color var(--transition);
    }

    /* ==============================
       HEADER
    ============================== */
    .top-bar {
      height: 70px;
      flex-shrink: 0;
      background: var(--header-bg);
      border-bottom: 2px solid var(--border);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 1.5rem;
      z-index: 50;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.2rem;
      background: var(--surface-2);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .back-btn:hover {
      color: var(--text);
      border-color: var(--primary);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .brand-emoji { font-size: 1.6rem; }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
    }

    /* Leyenda central */
    .top-bar-legend {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .legend-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.pendiente   { background: var(--pendiente); }
    .legend-dot.preparacion { background: var(--preparacion); }
    .legend-dot.entregado   { background: var(--entregado); }

    /* Derecha: toggle + reloj */
    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-shrink: 0;
    }

    /* Toggle modo */
    .theme-toggle {
      width: 52px;
      height: 28px;
      background: var(--surface-2);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-pill);
      cursor: pointer;
      position: relative;
      transition: background var(--transition), border-color var(--transition);
      flex-shrink: 0;
    }

    .theme-toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), background var(--transition);
    }

    [data-theme="light"] .theme-toggle::after {
      transform: translateX(24px);
      background: var(--accent);
    }

    .theme-icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
      pointer-events: none;
    }

    .theme-icon.moon { left: 5px; }
    .theme-icon.sun  { right: 5px; }

    .clock {
      font-size: 1.5rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
      color: var(--text-muted);
      min-width: 100px;
      text-align: right;
    }

    /* ==============================
       SPLIT LAYOUT (Flexbox for Smart TV compatibility)
    ============================== */
    .split {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background var(--transition);
      width: 50%;
    }

    .panel-cola   { background: var(--panel-cola-bg);  border-right: 2px solid var(--split-border); }
    .panel-listos { background: var(--panel-listo-bg); }

    /* Encabezado panel */
    .panel-title-bar {
      flex-shrink: 0;
      padding: 1.1rem 1.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .panel-icon { font-size: 1.7rem; }

    .panel-name {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.4px;
    }

    .panel-cola   .panel-name  { color: var(--pendiente); }
    .panel-listos .panel-name  { color: var(--entregado); }

    .panel-counter {
      font-size: 0.88rem;
      font-weight: 800;
      padding: 0.3rem 1rem;
      border-radius: var(--radius-pill);
    }

    .panel-cola   .panel-counter { background: var(--pend-bg); color: var(--pendiente); border: 1.5px solid rgba(245,158,11,0.3); }
    .panel-listos .panel-counter { background: var(--ent-bg);  color: var(--entregado); border: 1.5px solid rgba(34,197,94,0.3); }

    .panel-divider {
      height: 2px;
      flex-shrink: 0;
    }
    .panel-cola   .panel-divider { background: linear-gradient(90deg, var(--pendiente), transparent); opacity: 0.3; }
    .panel-listos .panel-divider { background: linear-gradient(90deg, var(--entregado), transparent); opacity: 0.35; }

    /* Scroll area */
    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .panel-scroll::-webkit-scrollbar { width: 5px; }
    .panel-scroll::-webkit-scrollbar-track { background: transparent; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

    /* ==============================
       CARDS
    ============================== */
    .order-card {
      border-radius: var(--radius-card);
      border: 2px solid transparent;
      background: var(--surface);
      padding: 1.5rem 1.75rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: background var(--transition), border-color var(--transition);
    }

    .order-card.is-new {
      animation: popIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }

    /* Franja de color arriba */
    .order-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      border-radius: var(--radius-card) var(--radius-card) 0 0;
    }

    .order-card.pendiente     { border-color: rgba(245,158,11,0.35); box-shadow: var(--shadow-glow-pend); }
    .order-card.en_preparacion{ border-color: rgba(249,115,22,0.5);  box-shadow: var(--shadow-glow-prep); }
    .order-card.entregado     { border-color: rgba(34,197,94,0.5);   box-shadow: var(--shadow-glow-ent); }

    .order-card.pendiente::before     { background: var(--pendiente); }
    .order-card.en_preparacion::before{ background: linear-gradient(90deg, var(--preparacion), #fb923c); }
    .order-card.entregado::before     { background: var(--entregado); }

    /* Badge de posición */
    .card-pos {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .order-card.pendiente     .card-pos { background: var(--pend-bg); color: var(--pendiente); }
    .order-card.en_preparacion .card-pos{ background: var(--prep-bg); color: var(--preparacion); }
    .order-card.entregado     .card-pos { background: var(--ent-bg);  color: var(--entregado); }

    /* Info */
    .card-info { flex: 1; min-width: 0; }

    .card-nombre {
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.4rem;
      line-height: 1.15;
      color: var(--text);
    }

    .card-items {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }

    /* Derecha */
    .card-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .card-status-icon { font-size: 2.8rem; line-height: 1; }

    .order-card.en_preparacion .card-status-icon {
      display: inline-block;
      animation: fireWiggle 1s ease-in-out infinite;
    }

    @keyframes fireWiggle {
      0%,100% { transform: scaleY(1); }
      40%     { transform: scaleY(1.18); }
      70%     { transform: scaleY(0.9); }
    }

    .card-hora {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ==============================
       EMPTY STATE
    ============================== */
    .panel-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      pointer-events: none;
    }

    .panel-empty-icon {
      font-size: 3.5rem;
      opacity: 0.35;
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-12px); }
    }

    .panel-empty-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-faint);
      line-height: 1.6;
    }

    /* ==============================
       FOOTER
    ============================== */
    .bottom-bar {
      height: 46px;
      flex-shrink: 0;
      background: var(--footer-bg);
      border-top: 2px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 2.5rem;
    }

    .bottom-stat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .bottom-info {
      margin-left: auto;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-faint);
    }

    /* ==============================
       RESPONSIVE
    ============================== */
    @media (max-width: 700px) {
      .split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .panel-cola { border-right: none; border-bottom: 2px solid var(--split-border); }
      .top-bar-legend { display: none; }
    }

    /* ==============================
       UKRAINIAN FLAG ACCENT STRIP
    ============================== */
    .ua-strip {
      height: 3px;
      background: linear-gradient(90deg, #005BBB 50%, #FFD700 50%);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="top-bar">
  <a href="/tomar-pedido" class="back-btn">← Hacer un pedido</a>

  <div class="brand">
    <img src="logo.jpg" alt="Logo" style="height:32px; width:32px; border-radius:6px; object-fit:cover;" />
    <span class="brand-name">AUCP</span>
  </div>

  <div class="top-bar-legend">
    <div class="legend-item">
      <div class="legend-dot pendiente"></div>
      En espera
    </div>
    <div class="legend-item">
      <div class="legend-dot preparacion"></div>
      Preparando
    </div>
    <div class="legend-item">
      <div class="legend-dot entregado"></div>
      Listo para retirar
    </div>
  </div>

  <div class="top-bar-right">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Cambiar modo oscuro/claro" aria-label="Cambiar tema">
      <span class="theme-icon moon">🌙</span>
      <span class="theme-icon sun">☀️</span>
    </button>
    <div class="clock" id="reloj">--:--:--</div>
  </div>
</header>
<div class="ua-strip"></div>

<!-- SPLIT SCREEN -->
<div class="split">

  <!-- PANEL IZQUIERDO: EN COLA -->
  <div class="panel panel-cola">
    <div class="panel-title-bar">
      <div class="panel-heading">
        <span class="panel-icon">⏳</span>
        <span class="panel-name">En cola</span>
      </div>
      <span class="panel-counter" id="counter-cola">0</span>
    </div>
    <div class="panel-divider"></div>
    <div class="panel-scroll" id="lista-cola"></div>
  </div>

  <!-- PANEL DERECHO: LISTOS -->
  <div class="panel panel-listos">
    <div class="panel-title-bar">
      <div class="panel-heading">
        <span class="panel-icon">✅</span>
        <span class="panel-name">Listos para retirar</span>
      </div>
      <span class="panel-counter" id="counter-listos">0</span>
    </div>
    <div class="panel-divider"></div>
    <div class="panel-scroll" id="lista-listos"></div>
  </div>

</div>

<!-- FOOTER -->
<div class="bottom-bar">
  <div class="bottom-stat">
    <span>⏳</span>
    <span style="color:var(--pendiente)" id="stat-pendiente">0</span>
    <span style="color:var(--text-faint)">esperando</span>
  </div>
  <div class="bottom-stat">
    <span>🔥</span>
    <span style="color:var(--preparacion)" id="stat-prep">0</span>
    <span style="color:var(--text-faint)">preparando</span>
  </div>
  <div class="bottom-stat">
    <span>✅</span>
    <span style="color:var(--entregado)" id="stat-entregado">0</span>
    <span style="color:var(--text-faint)">entregados hoy</span>
  </div>
  <div class="bottom-info" id="update-label">Cargando…</div>
</div>

<script>
  var API = '';

  /* ---- Reloj ---- */
  function tickReloj() {
    document.getElementById('reloj').textContent =
      new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  tickReloj();
  setInterval(tickReloj, 1000);

  /* ---- Helpers ---- */
  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML;
  }

  function fmtHora(fecha) {
    return new Date(fecha).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }

  var ESTADO_ICON = { pendiente: '⏳', en_preparacion: '🔥', entregado: '✅' };

  function itemsStr(pedido) {
    var items = (pedido.items || []).filter(function(i) {
      return i.producto_nombre;
    });
    if (!items.length) return '—';
    return items.map(function(i) {
      var qtyLabel = i.cantidad_tipo === 'media' ? '½ docena' : 'docena';
      return i.cantidad + '× ' + qtyLabel + ' de ' + esc(i.producto_nombre);
    }).join('  ·  ');
  }

  /* ---- Crear card DOM ---- */
  function crearCardEl(pedido, posicion, esNuevo) {
    var el = document.createElement('div');
    el.id = 'card-' + pedido.id;
    el.className = 'order-card ' + pedido.estado + (esNuevo ? ' is-new' : '');
    el.setAttribute('data-estado', pedido.estado);

    var posLabel = posicion !== null ? posicion : '✓';
    var icon     = ESTADO_ICON[pedido.estado] || '⏳';

    el.innerHTML = 
      '<div class="card-pos">' + posLabel + '</div>' +
      '<div class="card-info">' +
        '<div class="card-nombre">' + esc(pedido.nombre_cliente) + '</div>' +
        '<div class="card-items">' + itemsStr(pedido) + '</div>' +
      '</div>' +
      '<div class="card-right">' +
        '<span class="card-status-icon">' + icon + '</span>' +
        '<span class="card-hora">' + fmtHora(pedido.created_at) + '</span>' +
      '</div>';

    return el;
  }

  /* ---- Actualizar card existente (solo si cambió estado) ---- */
  function actualizarCardEl(el, pedido, posicion) {
    var estadoAnterior = el.getAttribute('data-estado');
    var nuevoEstado    = pedido.estado;

    var posEl = el.querySelector('.card-pos');
    if (posEl) posEl.textContent = posicion !== null ? posicion : '✓';

    if (estadoAnterior !== nuevoEstado) {
      el.classList.remove(estadoAnterior);
      el.classList.add(nuevoEstado);
      el.setAttribute('data-estado', nuevoEstado);
      var iconEl = el.querySelector('.card-status-icon');
      if (iconEl) iconEl.textContent = ESTADO_ICON[nuevoEstado] || '⏳';
    }
  }

  /* ---- Empty placeholder ---- */
  function emptyEl(icon, text) {
    var el = document.createElement('div');
    el.className = 'panel-empty';
    el.id = 'empty-placeholder';
    el.innerHTML = '<span class="panel-empty-icon">' + icon + '</span><span class="panel-empty-text">' + esc(text) + '</span>';
    return el;
  }

  /* ---- Estado local ---- */
  var estadoCola   = {};
  var estadoListos = {};
  var primeraCarga = true;

  /* ---- Patch panel cola ---- */
  function patchCola(enCola) {
    var container = document.getElementById('lista-cola');
    
    // build a list of current IDs in the update
    var nuevoIds = {};
    for (var k = 0; k < enCola.length; k++) {
      nuevoIds[enCola[k].id] = true;
    }

    // remove from DOM and local state any that are no longer present
    for (var id in estadoCola) {
      if (estadoCola.hasOwnProperty(id)) {
        if (!nuevoIds[id]) {
          var cardEl = document.getElementById('card-' + id);
          if (cardEl) cardEl.parentNode.removeChild(cardEl);
          delete estadoCola[id];
        }
      }
    }

    var emptyPlaceholder = document.querySelector('#lista-cola #empty-placeholder');
    if (emptyPlaceholder) emptyPlaceholder.parentNode.removeChild(emptyPlaceholder);

    // add or update
    for (var i = 0; i < enCola.length; i++) {
      var pedido = enCola[i];
      var pos = i + 1;
      var existente = document.getElementById('card-' + pedido.id);
      if (!existente) {
        container.appendChild(crearCardEl(pedido, pos, !primeraCarga));
      } else {
        actualizarCardEl(existente, pedido, pos);
      }
      estadoCola[pedido.id] = pedido.estado;
    }

    if (enCola.length === 0 && !document.querySelector('#lista-cola #empty-placeholder')) {
      container.appendChild(emptyEl('😴', 'Sin pedidos en espera por ahora'));
    }

    document.getElementById('counter-cola').textContent = enCola.length;
  }

  /* ---- Patch panel listos ---- */
  function patchListos(entregadosHoy) {
    var container = document.getElementById('lista-listos');
    var nuevoIds = {};
    for (var k = 0; k < entregadosHoy.length; k++) {
      nuevoIds[entregadosHoy[k].id] = true;
    }

    for (var id in estadoListos) {
      if (estadoListos.hasOwnProperty(id)) {
        if (!nuevoIds[id]) {
          var cardEl = document.getElementById('card-' + id);
          if (cardEl) cardEl.parentNode.removeChild(cardEl);
          delete estadoListos[id];
        }
      }
    }

    var emptyPlaceholder = document.querySelector('#lista-listos #empty-placeholder');
    if (emptyPlaceholder) emptyPlaceholder.parentNode.removeChild(emptyPlaceholder);

    for (var i = 0; i < entregadosHoy.length; i++) {
      var pedido = entregadosHoy[i];
      if (!document.getElementById('card-' + pedido.id)) {
        var newCard = crearCardEl(pedido, null, !primeraCarga);
        if (container.firstChild) {
          container.insertBefore(newCard, container.firstChild);
        } else {
          container.appendChild(newCard);
        }
        estadoListos[pedido.id] = pedido.estado;
      }
    }

    if (entregadosHoy.length === 0 && !document.querySelector('#lista-listos #empty-placeholder')) {
      container.appendChild(emptyEl('🟢', 'Acá aparecerán los pedidos\nlistos para retirar'));
    }

    document.getElementById('counter-listos').textContent = entregadosHoy.length;
  }

  /* ---- Fetch ---- */
  function cargarPedidos() {
    var pendientes, enPrep, entregados;

    Promise.all([
      fetch(API + '/api/pedidos?estado=pendiente').then(function(r) { return r.json(); }),
      fetch(API + '/api/pedidos?estado=en_preparacion').then(function(r) { return r.json(); }),
      fetch(API + '/api/pedidos?estado=entregado').then(function(r) { return r.json(); })
    ])
    .then(function(results) {
      pendientes = results[0];
      enPrep = results[1];
      entregados = results[2];

      pendientes.sort(function(a, b) { return new Date(a.created_at) - new Date(b.created_at); });
      enPrep.sort(function(a, b) { return new Date(a.created_at) - new Date(b.created_at); });
      var enCola = pendientes.concat(enPrep);

      var hoy = new Date().toDateString();
      var entregadosHoy = entregados
        .filter(function(p) { return new Date(p.created_at).toDateString() === hoy; })
        .sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });

      patchCola(enCola);
      patchListos(entregadosHoy);

      document.getElementById('stat-pendiente').textContent = pendientes.length;
      document.getElementById('stat-prep').textContent      = enPrep.length;
      document.getElementById('stat-entregado').textContent = entregadosHoy.length;
      document.getElementById('update-label').textContent   =
        'Última actualización: ' + new Date().toLocaleTimeString('es-AR');

      primeraCarga = false;
    })
    .catch(function(err) {
      document.getElementById('update-label').textContent = '⚠️ Sin conexión con el servidor';
    });
  }

  cargarPedidos();
  setInterval(cargarPedidos, 3000);
</script>
</body>
